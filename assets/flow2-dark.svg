<g class="a" style="animation-name:k3;"><rect x="417" y="73" width="126" height="114" rx="18" fill="none" stroke="#b7a8e0" stroke-width="4"/></g><rect x="552" y="76" width="120" height="108" rx="16" fill="#2a2531" stroke="#3d3649" stroke-width="2"/><rect x="598" y="30" width="28" height="28" rx="0" fill="#b7a8e0"/><text x="612" y="49.6" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2a2531" text-anchor="middle">5</text><text x="612" y="114" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#efe8f3" text-anchor="middle">Build</text><text x="612" y="140" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#aa9cb4" text-anchor="middle">Small working</text><text x="612" y="160" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#aa9cb4" text-anchor="middle">version first</text><g class="a" style="animation-name:k4;"><rect x="549" y="73" width="126" height="114" rx="18" fill="none" stroke="#b7a8e0" stroke-width="4"/></g><rect x="684" y="76" width="120" height="108" rx="16" fill="#2a2531" stroke="#8fcfae" stroke-width="2"/><rect x="730" y="30" width="28" height="28" rx="0" fill="#8fcfae"/><text x="744" y="49.6" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2a2531" text-anchor="middle">6</text><text x="744" y="114" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#efe8f3" text-anchor="middle">Verify</text><text x="744" y="140" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#aa9cb4" text-anchor="middl