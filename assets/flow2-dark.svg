ound"/></g><text x="678" y="248" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f0a98a" text-anchor="middle">FAIL: fix, check again</text><path d="M768 184 L768 276 Q768 284 760 284 L224 284 Q216 284 216 276 L216 186" fill="none" stroke="#8fcfae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M222 194 L216 186 L210 194" fill="none" stroke="#8fcfae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="306" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8fcfae" text-anchor="middle">PASS closes the item in the ledger</text><g class="a" style="animation-name:k8;" transform="rotate(-8 778 70)"><rect x="746" y="58" width="64" height="26" rx="6" fill="#2a2531" stroke="#f0a98a" stroke-width="2.5"/><text x="778" y="77" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#f0a98a" text-anchor="middle">FAIL</text></g><g class="a" style="animation-name:k9;" transform="rotate(-8 778 70)"><rect x="746" y="58" width="64" height="26" rx="6" fill="#2a2531" stroke="#8fcfae" stroke-width="2.5"/><text x="778" y="77" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#8fcfae" text-anchor="middle">PASS</text></g><rect x="24" y="332" width="912" height="64" rx="12" fill="#352f40"/><text x="48" y="360" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#efe8f3" text-anchor="start">Guards run on every tool call</text><text x="48" y="382" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#aa9cb4" text-anchor="start">Plain scripts, no model tokens. Each one asks you or says no.</text><g class="a" style="animation-name:k10;"><rect x="24" y="332" width="912" height="64" rx="12" fill="none" stroke="#b7a8e0" stroke-width="3"/></g><g class="a" style="animation-name:k12;"><rect x="79" y="39" width="10" height="10" rx="0" fill="#efe8f3" class="a" style="animation-name:k11;"/></g><g class="a" style="animation-name:k14;"><rect x="719" y="185" width="10" height="10" rx="0" fill="#efe8f3" class="a" style="animation-name:k13;"/></g></svg>