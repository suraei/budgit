<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="A timeline of four stops: a long chat, Claude compacts it, Budgit saves a checkpoint just before, and the next session is pointed to the newest checkpoint"><rect x="1" y="1" width="958" height="198" rx="24" fill="#26222d" stroke="#3d3649" stroke-width="2"/><line x1="120" y1="100" x2="840" y2="100" stroke="#3d3649" stroke-width="4" stroke-linecap="round"/><line x1="120" y1="100" x2="600" y2="100" stroke="#b7a8e0" stroke-width="4" stroke-linecap="round"/><circle cx="120" cy="100" r="14" fill="#2a2531" stroke="#b7a8e0" stroke-width="4"/><circle cx="360" cy="100" r="14" fill="#2a2531" stroke="#b7a8e0" stroke-width="4"/><circle cx="600" cy="100" r="14" fill="#8fcfae" stroke="#8fcfae" stroke-width="4"/><circle cx="840" cy="100" r="14" fill="#2a2531" stroke="#b7a8e0" stroke-width="4"/><g font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle"><text x="120" y="62" font-size="20" font-weight="700" fill="#efe8f3">A long chat</text><text x="360" y="62" font-size="20" font-weight="700" fill="#efe8f3">Claude compacts</text><text x="600" y="62" font-size="20" font-weight="700" fill="#efe8f3">Checkpoint saved</text><text x="840" y="62" font-size="20" font-weight="700" fill="#efe8f3">Next session</text><text x="120" y="146" font-size="15" fill="#aa9cb4">the work piles up</text><text x="360" y="146" font-size="15" fill="#aa9cb4">the old turns fold away</text><text x="600" y="146" font-size="15" fill="#aa9cb4">just before: open items, git state</text><text x="840" y="146" font-size="15" fill="#aa9cb4">pointed to the newest one</text></g></svg>
