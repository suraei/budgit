amily="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#efe8f3" text-anchor="start">at most 3 decisions a day, urgent first</text><text x="554" y="450" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#aa9cb4" text-anchor="start">each with a default if nobody answers</text></svg>