tem-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#efe8f3" text-anchor="start">Dark mode</text></g><g class="a" style="animation-name:k9;"><g class="a" style="animation-name:k8;"><rect x="216" y="126" width="160" height="52" rx="10" fill="#2a2531" stroke="#3d3649" stroke-width="2"/><text x="226" y="146" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#b7a8e0" text-anchor="start">R-4</text><text x="226" y="166" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#efe8f3" text-anchor="start">List by aisle</text><g class="a" style="animation-name:k5;"><rect x="320" y="132" width="50" height="18" rx="9" fill="#b7a8e0"/><text x="345" y="145" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2a2531" text-anchor="middle">chat A</text></g><g class="a" style="animation-name:k6;"><rect x="314" y="154" width="56" height="20" rx="5" fill="#2a2531" stroke="#f0a98a" stroke-width="2"/><text x="342" y="169" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f0a98a" text-anchor="middle">FAIL</text></g><g class="a" style="animation-name:k7;"><rect x="314" y="154" width="56" height="20" rx="5" fill="#2a2531" stroke="#8fcfae" stroke-width="2"/><text x="342" y="169" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#8fcfae" text-anchor="middle">PASS</text></g></g></g><rect x="24" y="376" width="448" height="96" rx="14" fill="#2a2531" stroke="#3d3649" stroke-width="2"/><circle cx="58" cy="420" r="9" fill="#3e3626" stroke="#e8c56f" stroke-width="2"/><path d="M71 420 L75 420" fill="none" stroke="#e8c56f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M67.19 429.1