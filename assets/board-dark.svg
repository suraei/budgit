<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" role="img" aria-label="An animated task board with five columns: later, open, doing, done, verified. A message arrives as an input and becomes R-4 in open; chat A claims it and it moves to doing, where 2 run at once; it moves to done, the verifier answers FAIL and it goes back; then PASS, and it lands in verified. A new idea drops straight into later. Below: budgit daily, a morning read, and budgit triggers, at most 3 decisions a day, each with a default. The ids and counts are illustrative"><style>.a,.st,.ln{animation-duration:14s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}.st{animation-timing-function:steps(14,end)}.ln{animation-timing-function:linear}@keyframes k0{0%{transform:translate(0px,0px)}10%{transform:translate(0px,0px)}14.29%{transform:translate(0px,98px)}100%{transform:translate(0px,98px)}}@keyframes k1{0%{opacity:0}2.14%{opacity:0}3.57%{opacity:1}13.57%{opacity:1}15%{opacity:0}100%{opacity:0}}@keyframes k2{0%{transform:translate(0px,0px)}30%{transform:translate(0px,0px)}34.29%{transform:translate(0px,98px)}100%{transform:translate(0px,98px)}}@keyframes k3{0%{opacity:0}25.71%{opacity:0}27.14%{opacity:1}33.57%{opacity:1}35%{opacity:0}100%{opacity:0}}@keyframes k4{0%{opacity:0}34.29%{opacity:0}35.71%{opacity:1}97.14%{opacity:1}98.57%{opacity:0}100%{opacity:0}}@keyframes k5{0%{opacity:0}17.86%{opacity:0}19.29%{opacity:1}68.57%{opacity:1}70%{opacity:0}100%{opacity:0}}@keyframes k6{0%{opacity:0}37.86%{opacity:0}39.29%{opacity:1}47.14%{opacity:1}48.57%{opacity:0}100%{opacity:0}}@keyframes k7{0%{opacity:0}62.86%{opacity:0}64.29%{opacity:1}95.71%{opacity:1}97.14%{opacity:0}100%{opacity:0}}@keyframes k8{0%{transform:translate(0px,0px)}14.29%{transform:translate(0px,0px)}20.71%{transform:translate(0px,0px)}25%{transform:translate(184px,0px)}31.43%{transform:translate(184px,0px)}35.71%{transform:translate(368px,0px)}45.71%{transform:translate(368px,0px)}50%{transform:translate(184px,0px)}55.71%{transform:translate(184px,0px)}60%{transform:translate(368px,0px)}67.14%{transform:translate(368px,0px)}71.43%{transform:translate(552px,0px)}98.93%{transform:translate(552px,0px)}99.29%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}@keyframes k9{0%{opacity:0}14.29%{opacity:0}15.71%{opacity:1}97.14%{opacity:1}98.57%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){.a,.st,.ln{animation-delay:-12s!important;animation-play-state:paused!important}}</style><rect x="1" y="1" width="958" height="494" rx="24" fill="#26222d" stroke="#3d3649" stroke-width="2"/><rect x="24" y="20" width="912" height="48" rx="12" fill="#352f40"/><text x="40" y="49" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#aa9cb4" text-anchor="start">Inputs</text><text x="400" y="49" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#efe8f3" text-anchor="start">Every message is an input. ledger match looks for its item first.</text><text x="36" y="104" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#aa9cb4" text-anchor="start">Later</text><rect x="24" y="116" width="176" height="244" rx="12" fill="#2a2531" stroke="#3d3649" stroke-width="1.5" stroke-dasharray="4 4"/><text x="220" y="104" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#efe8f3" text-anchor="start">Open</text><rect x="208" y="116" width="176" height="244" rx="12" fill="#2a2531" stroke="#3d3649" stroke-width="1.5"/><text x="404" y="104" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#efe8f3" text-anchor="start">Doing</text><rect x="488" y="88" width="70.2" height="20" rx="10.0" fill="#2a2531" stroke="#aa9cb4" stroke-width="1.5"/><text x="523.1" y="101.6" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#aa9cb4" text-anchor="middle">2 at once</text><rect x="392" y="116" width="176" height="244" rx="12" fill="#2a2531" stroke="#3d3649" stroke-width="1.5"/><text x="588" y="104" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#efe8f3" text-anchor="start">Done</text><rect x="576" y="116" width="176" height="244" rx="12" fill="#2a2531" stroke="#3d3649" stroke-width="1.5"/><text x="772" y="104" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#8fcfae" text-anchor="start">Verified</text><rect x="760" y="116" width="176" height="244" rx="12" fill="#2a2531" stroke="#3d3649" stroke-width="1.5"/><rect x="216" y="188" width="160" height="52" rx="10" fill="#2a2531" stroke="#3d3649" stroke-width="2"/><text x="226" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#b7a8e0" text-anchor="start">R-3</text><text x="226" y="228" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#efe8f3" text-anchor="start">Recipe import</text><rect x="400" y="188" width="160" height="52" rx="10" fill="#2a2531" stroke="#3d3649" stroke-width="2"/><text x="410" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#b7a8e0" text-anchor="start">R-2</text><text x="410" y="228" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#efe8f3" text-anchor="start">Weekly plan</text><rect x="504" y="194" width="50"