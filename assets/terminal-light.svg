<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="A Claude Code terminal in a demo project called meal-planner. The user asks for a shopping list grouped by aisle. Budgit saves it as R-3 in the ledger, a critic checks the plan, Claude builds it, a fresh verifier runs it and answers PASS. The status line below shows 1 in progress, 4 to do, 2 ideas and the week at 31 percent. An illustrative session"><rect x="1" y="1" width="958" height="468" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><rect x="24" y="24" width="912" height="422" rx="16" fill="#f3edf8" stroke="#e1d7ea" stroke-width="2"/><rect x="25" y="25" width="910" height="40" rx="15" fill="#e9e1f1"/><rect x="25" y="45" width="910" height="20" fill="#e9e1f1"/><rect x="48" y="38" width="12" height="12" fill="#7d68c4"/><rect x="68" y="38" width="12" height="12" fill="#4f9672"/><rect x="88" y="38" width="12" height="12" fill="#c8774d"/><text x="480" y="51" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#6f6076" text-anchor="middle">meal-planner  —  claude</text><text x="52" y="100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">❯ </tspan><tspan fill="#3a2f3d" font-weight="600">add a shopping list that groups the items by aisle</tspan></text><text x="52" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Saved as </tspan><tspan fill="#7d68c4" font-weight="700">R-3</tspan><tspan fill="#3a2f3d" font-weight="400"> in the ledger, word for word.</tspan></text><text x="52" y="178" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Level normal. A fresh critic read the plan: 3 small tasks, a test for each.</tspan></text><text x="52" y="204" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Built, tests first. 6 of 6 pass.</tspan></text><text x="52" y="256" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Handing R-3 to the verifier, which never saw the build.</tspan></text><text x="52" y="282" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#6f6076" font-weight="400">  ▸ starts the app on a clean state, adds 12 items, checks the aisle order</tspan></text><text x="52" y="334" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#4f9672" font-weight="700">✔ PASS </tspan><tspan fill="#3a2f3d" font-weight="400"> R-3  shopping list by aisle  ·  report saved</tspan></text><text x="52" y="360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">R-3 is done, with proof. Next in the list: R-4, recipes by ingredient.</tspan></text><rect x="48" y="392" width="864" height="2" fill="#e1d7ea"/><text x="52" y="424" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#6f6076">budgit  </tspan><tspan fill="#3f7f2c">✿ 1 in progress</tspan><tspan fill="#b4467a"> ⁘ 4 to do</tspan><tspan fill="#6d57b8"> ✧ 2 ideas</tspan><tspan fill="#8a7f92"> ┊ </tspan><tspan fill="#2f7fbf">▰▰</tspan><tspan fill="#8a7f92">▱▱▱▱</tspan><tspan fill="#2f7fbf"> 31 %</tspan><tspan fill="#8a7f92"> · </tspan><tspan fill="#3f7f2c">you make it</tspan></text></svg>
