<svg xmlns="http://www.w3.org/2000/svg" width="360" height="356" viewBox="0 0 360 356" role="img" aria-label="An animated gauge of what Claude holds in mind. The kickoff core is always there. A phase file and its lenses slide in when the phase starts and leave after it. Installed skills wait as names, and skills why loads one for the job, then lets it go. The chat fills the gauge, Claude compacts, and the next chat starts from a checkpoint instead of the whole chat"><style>.a,.st,.ln{animation-duration:16s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}.st{animation-timing-function:steps(14,end)}.ln{animation-timing-function:linear}@keyframes k0{0%{transform:translate(164px,0px)}12.5%{transform:translate(164px,0px)}16.25%{transform:translate(0px,0px)}30%{transform:translate(0px,0px)}33.75%{transform:translate(164px,0px)}100%{transform:translate(164px,0px)}}@keyframes k1{0%{transform:translate(164px,0px)}32.5%{transform:translate(164px,0px)}36.25%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}@keyframes k2{0%{opacity:0}31.87%{opacity:0}33.12%{opacity:1}76.25%{opacity:1}77.5%{opacity:0}100%{opacity:0}}@keyframes k3{0%{opacity:1}50%{opacity:1}51.25%{opacity:0.25}61.25%{opacity:0.25}62.5%{opacity:1}100%{opacity:1}}@keyframes k4{0%{opacity:0}41.25%{opacity:0}42.5%{opacity:1}76.25%{opacity:1}77.5%{opacity:0}100%{opacity:0}}@keyframes k5{0%{opacity:0}50%{opacity:0}51.25%{opacity:1}61.25%{opacity:1}62.5%{opacity:0}100%{opacity:0}}@keyframes k6{0%{transform:scaleY(0)}65%{transform:scaleY(0)}75%{transform:scaleY(1)}76.88%{transform:scaleY(1)}78.12%{transform:scaleY(0)}100%{transform:scaleY(0)}}@keyframes k7{0%{opacity:0}72.5%{opacity:0}73.44%{opacity:1}76.88%{opacity:1}77.81%{opacity:0}100%{opacity:0}}@keyframes k8{0%{opacity:0}77.5%{opacity:0}78.75%{opacity:1}97.5%{opacity:1}98.75%{opacity:0}100%{opacity:0}}@keyframes k9{0%{opacity:0}0%{opacity:0}1.56%{opacity:1}11.25%{opacity:1}12.81%{opacity:0}100%{opacit