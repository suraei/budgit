nt-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#6f6076" text-anchor="middle">+ its lenses</text></g></g><g class="a" style="animation-name:k4;"><rect x="24" y="200" width="32" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="40" y="212" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">tdd</text><g class="a" style="animation-name:k3;"><rect x="60" y="200" width="32" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="76" y="212" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">review</text></g><rect x="96" y="200" width="32" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="112" y="212" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">ui</text></g><g class="a" style="animation-name:k5;"><rect x="24" y="138" width="108" height="52" rx="8" fill="#fffdf8" stroke="#4f9672" stroke-width="2"/><text x="78" y="160" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3a2f3d" text-anchor="middle">code-review</text><text x="78" y="178" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#4f9672" text-anchor="middle">via skills why</text></g><g class="a" style="animation-name:k6;transform-box:fill-box;transform-origin:50% 100%"><rect x="18" y="22" width="120" height="296" rx="14" fill="#f8e4d8"/><text x="78" y="170" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c877