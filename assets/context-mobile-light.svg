ss="a" style="animation-name:k10;"><rect x="150" y="96" width="200" height="70" rx="14" fill="#ece4f4"/></g><rect x="158" y="106" width="24" height="24" rx="0" fill="#7d68c4"/><text x="170" y="122.8" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fffdf8" text-anchor="middle">2</text><text x="190" y="123" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#3a2f3d" text-anchor="start">One phase at a time</text><text x="190" y="140" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">Its file comes in, then</text><text x="190" y="154" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">leaves.</text><g class="a" style="animation-name:k11;"><rect x="150" y="172" width="200" height="70" rx="14" fill="#ece4f4"/></g><rect x="158" y="182" width="24" height="24" rx="0" fill="#7d68c4"/><text x="170" y="198.8" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fffdf8" text-anchor="middle">3</text><text x="190" y="199" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#3a2f3d" text-anchor="start">Skills wait as names</text><text x="190" y="216" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">skills why loads one for the</text><text x="190" y="230" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">job.</text><g class="a" style="animation-name:k12;"><rect x="150" y="248" width="200" height="70" rx="14" fill="#ece4f4"/></g><rect x="158" y="258" width="24" height="24" rx="0" fill="#7d68c4"/><text x="170" y="274.8" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fffdf8" text-anchor="middle">4</text><text x="190" y="275" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#3a2f3d" text-anchor="start">Long chats restart light</text><text x="190" y="292" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">The next chat starts from a</text><text x="190" y="306" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">checkpoint.</text></svg>