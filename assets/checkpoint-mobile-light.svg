<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-label="A timeline of four stops: a long chat, Claude compacts it, Budgit saves a checkpoint just before, and the next session is pointed to the newest checkpoint"><rect x="1" y="1" width="358" height="338" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><line x1="40" y1="50" x2="40" y2="290" stroke="#e1d7ea" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="50" x2="40" y2="210" stroke="#7d68c4" stroke-width="4" stroke-linecap="round"/><circle cx="40" cy="50" r="12" fill="#fffdf8" stroke="#7d68c4" stroke-width="4"/><circle cx="40" cy="130" r="12" fill="#fffdf8" stroke="#7d68c4" stroke-width="4"/><circle cx="40" cy="210" r="12" fill="#4f9672" stroke="#4f9672" stroke-width="4"/><circle cx="40" cy="290" r="12" fill="#fffdf8" stroke="#7d68c4" stroke-width="4"/><g font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start"><text x="68" y="48" font-size="17" font-weight="700" fill="#3a2f3d">A long chat</text><text x="68" y="68" font-size="13" fill="#6f6076">the work piles up</text><text x="68" y="128" font-size="17" font-weight="700" fill="#3a2f3d">Claude compacts</text><text x="68" y="148" font-size="13" fill="#6f6076">the old turns fold away</text><text x="68" y="208" font-size="17" font-weight="700" fill="#3a2f3d">Checkpoint saved</text><text x="68" y="228" font-size="13" fill="#6f6076">just before: open items, git state</text><text x="68" y="288" font-size="17" font-weight="700" fill="#3a2f3d">Next session</text><text x="68" y="308" font-size="13" fill="#6f6076">pointed to the newest one</text></g></svg>
