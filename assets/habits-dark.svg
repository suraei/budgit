><text x="848" y="214" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#aa9cb4" text-anchor="middle">new chat when one slows</text></svg>