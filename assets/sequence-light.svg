<svg xmlns="http://www.w3.org/2000/svg" width="960" height="602" viewBox="0 0 960 602" role="img" aria-label="One request across five parties, from a message to a closed item: you ask Claude, who saves it as R-3; the builder builds while the guards check every tool call; the verifier says FAIL once, the builder fixes it, the verifier says PASS, and Claude tells you R-3 is done with proof"><rect x="1" y="1" width="958" height="600" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><rect x="34" y="24" width="152" height="64" rx="14" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><text x="110" y="52" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#3a2f3d" text-anchor="middle">You</text><path d="M110 88 V578" stroke="#e1d7ea" stroke-width="2" stroke-dasharray="3 6"/><rect x="214" y="24" width="152" height="64" rx="14" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><text x="290" y="52" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#3a2f3d" text-anchor="middle">Claude</text><text x="290" y="74" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="middle">keeps the ledger</text><path d="M290 88 V578" stroke="#e1d7ea" stroke-width="2" stroke-dasharray="3 6"/><rect x="394" y="24" width="152" height="64" rx="14" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><text x="470" y="52" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#3a2f3d" text-anchor="middle">Builder</text><text x="470" y="74" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="middle">your session or a lane</text><path d="M470 88 V578" stroke="#e1d7ea" stroke-width="2" stroke-dasharray="3 6"/><rect x="574" y="24" width="152" height="64" rx="14" fill="#fffdf8" stroke="#4f9672" stroke-width="2"/><text x="650" y="52" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#3a2f3d" text-anchor="middle">Verifier</text><text x="650" y="74" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="middle">fresh, never saw the build</text><path d="M650 88 V578" stroke="#e1d7ea" stroke-width="2" stroke-dasharray="3 6"/><rect x="754" y="24" width="152" height="64" rx="14" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><text x="830" y="52" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#3a2f3d" text-anchor="middle">Guards</text><text x="830" y="74" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="middle">plain scripts</text><path d="M830 88 V578" stroke="#e1d7ea" stroke-width="2" stroke-dasharray="3 6"/><rect x="198" y="96" width="184" height="28" rx="8" fill="#e9e1f1"/><text x="290" y="115" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#7d68c4" text-anchor="middle">R-3 saved word for word</text><path d="M116 152 H282" stroke="#3a2f3d" stroke-width="2"/><path d="M274 146 L284 152 L274 158" fill="none" stroke="#3a2f3d" stroke-width="2"/><text x="200" y="144" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#3a2f3d" text-anchor="middle">add a shopping list</text><path d="M296 190 H462" stroke="#3a2f3d" stroke-width="2"/><path d="M454 184 L464 190 L454 196" fill="none" stroke="#3a2f3d" stroke-width="2"/><text x="380" y="182" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#3a2f3d" text-anchor="middle">build the smallest version</text><path d="M476 228 H822" stroke="#6f6076" stroke-width="2" stroke-dasharray="6 5"/><path d="M814 222 L824 228 L814 234" fill="none" stroke="#6f6076" stroke-width="2"/><text x="650" y="220" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="middle">every tool call</text><path d="M824 266 H478" stroke="#6f6076" stroke-width="2" stroke-dasharray="6 5"/><path d="M486 260 L476 266 L486 272" fill="none" stroke="#6f6076" stroke-width="2"/><text x="650" y="258" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="middle">allow, ask or no</text><path d="M464 304 H298" stroke="#3a2f3d" stroke-width="2"/><path d="M306 298 L296 304 L306 310" fill="none" stroke="#3a2f3d" stroke-width="2"/><text x="380" y="296" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#3a2f3d" text-anchor="middle">built, tests first</text><path d="M296 342 H642" stroke="#3a2f3d" stroke-width="2"/><path d="M634 336 L644 342 L634 348" fill="none" stroke="#3a2f3d" stroke-width="2"/><text x="470" y="334" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#3a2f3d" text-anchor="middle">check R-3, fresh state</text><path d="M644 380 H298" stroke="#c8774d" stroke-width="2"/><path d="M306 374 L296 380 L306 386" fill="none" stroke="#c8774d" stroke-width="2"/><text x="470" y="372" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#c8774d" text-anchor="middle">FAIL: empty list breaks</text><path d="M296 418 H462" stroke="#3a2f3d" stroke-width="2"/><path d="M454 412 L464 418 L454 424" fill="none" stroke="#3a2f3d" stroke-width="2"/><text x="380" y="410" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#3a2f3d" text-anchor="middle">fix it</text><path d="M296 456 H642" stroke="#3a2f3d" stroke-width="2"/><path d="M634 450 L644 456 L634 462" fill="none" stroke="#3a2f3d" stroke-width="2"/><text x="470" y="448" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#3a2f3d" text-anchor="middle">check again</text><path d="M644 494 H298" stroke="#4f9672" stroke-width="2"/><path d="M306 488 L296 494 L306 500" fill="none" stroke="#4f9672" stroke-width="2"/><text x="470" y="486" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4f9672" text-anchor="middle">PASS, report saved</text><path d="M284 532 H118" stroke="#4f9672" stroke-width="2"/><path d="M126 526 L116 532 L126 538" fill="none" stroke="#4f9672" stroke-width="2"/><text x="200" y="524" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4f9672" text-anchor="middle">R-3 done, with proof</text></svg>
