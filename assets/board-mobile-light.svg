s, monospace" font-size="11" font-weight="700" fill="#7d68c4" text-anchor="start">R-4</text><text x="110" y="205" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3a2f3d" text-anchor="start">List by aisle</text><g class="a" style="animation-name:k5;"><rect x="170" y="174" width="40" height="16" rx="8" fill="#7d68c4"/><text x="190" y="186" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fffdf8" text-anchor="middle">chat A</text></g><g class="a" style="animation-name:k6;"><rect x="158" y="202" width="50" height="18" rx="5" fill="#fffdf8" stroke="#c8774d" stroke-width="2"/><text x="183" y="215" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#c8774d" text-anchor="middle">FAIL</text></g><g class="a" style="animation-name:k7;"><rect x="158" y="202" width="50" height="18" rx="5" fill="#fffdf8" stroke="#4f9672" stroke-width="2"/><text x="183" y="215" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#4f9672" text-anchor="middle">PASS</text></g></g></g><rect x="12" y="496" width="336" height="60" rx="12" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><text x="24" y="520" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7d68c4" text-anchor="start">budgit daily</text><text x="24" y="540" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3a2f3d" text-anchor="start">2 doing · 5 to do · next version: bug first</text><rect x="12" y="566" width="336" height="60" rx="12" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><text x="24" y="590" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-siz