<svg xmlns="http://www.w3.org/2000/svg" width="360" height="642" viewBox="0 0 360 642" role="img" aria-label="An animated task board with five columns: later, open, doing, done, verified. A message arrives as an input and becomes R-4 in open; chat A claims it and it moves to doing, where 2 run at once; it moves to done, the verifier answers FAIL and it goes back; then PASS, and it lands in verified. A new idea drops straight into later. Below: budgit daily, a morning read, and budgit triggers, at most 3 decisions a day, each with a default. The ids and counts are illustrative"><style>.a,.st,.ln{animation-duration:14s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}.st{animation-timing-function:steps(14,end)}.ln{animation-timing-function:linear}@keyframes k0{0%{transform:translate(0px,0px)}10%{transform:translate(0px,0px)}14.29%{transform:translate(0px,146px)}100%{transform:translate(0px,146px)}}@keyframes k1{0%{opacity:0}2.14%{opacity:0}3.57%{opacity:1}13.57%{opacity:1}15%{opacity:0}100%{opacity:0}}@keyframes k2{0%{transform:translate(0px,0px)}30%{transform:translate(0px,0px)}34.29%{transform:translate(0px,62px)}100%{transform:translate(0px,62px)}}@keyframes k3{0%{opacity:0}25.71%{opacity:0}27.14%{opacity:1}33.57%{opacity:1}35%{opacity:0}100%{opacity:0}}@keyframes k4{0%{opacity:0}34.29%{opacity:0}35.71%{opacity:1}97.14%{opacity:1}98.57%{opacity:0}100%{opacity:0}}@keyframes k5{0%{opacity:0}17.86%{opacity:0}19.29%{opacity:1}68.57%{opacity:1}70%{opacity:0}100%{opacity:0}}@keyframes k6{0%{opacity:0}37.86%{opacity:0}39.29%{opacity:1}47.14%{opacity:1}48.57%{opacity:0}100%{opacity:0}}@keyframes k7{0%{opacity:0}62.86%{opacity:0}64.29%{opacity:1}95.71%{opacity:1}97.14%{opacity:0}100%{opacity:0}}@keyframes k8{0%{transform:translate(0px,0px)}14.29%{transform:translate(0px,0px)}20.71%{transform:translate(0px,0px)}25%{transform:translate(0px,84px)}31.43%{transform:translate(0px,84px)}35.71%{transform:translate(0px,168px)}45.71%{transform:translate(0px,168px)}50%{transform:translate(0px,84px)}55.71%{transform:translate(0px,84px)}60%{transform:translate(0px,168px)}67.14%{transform:translate(0px,168px)}71.43%{transform:translate(0px,252px)}98.93%{transform:translate(0px,252px)}99.29%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}@keyframes k9{0%{opacity:0}14.29%{opacity:0}15.71%{opacity:1}97.14%{opacity:1}98.57%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){.a,.st,.ln{animation-delay:-12s!important;animation-play-state:paused!important}}</style><rect x="1" y="1" width="358" height="640" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><rect x="12" y="12" width="336" height="52" rx="12" fill="#ece4f4"/><text x="20" y="30" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#6f6076" text-anchor="start">inputs</text><text x="16" y="106" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6f6076" text-anchor="start">Later</text><rect x="92" y="76" width="256" height="72" rx="10" fill="#fffdf8" stroke="#e1d7ea" stroke-width="1.5" stroke-dasharray="4 4"/><text x="16" y="190" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3a2f3d" text-anchor="start">Open</text><rect x="92" y="160" width="256" height="72" rx="10" fill="#fffdf8" stroke="#e1d7ea" stroke-width="1.5"/><text x="16" y="274" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3a2f3d" text-anchor="start">Doing</text><text x="16" y="292" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="start">2 at once</text><rect x="92" y="244" width="256" height="72" rx="10" fill="#fffdf