<svg xmlns="http://www.w3.org/2000/svg" width="360" height="657" viewBox="0 0 360 657" role="img" aria-label="A Claude Code terminal in a demo project called meal-planner. The user asks for a shopping list grouped by aisle. Budgit saves it as R-3 in the ledger, a critic checks the plan, Claude builds it, a fresh verifier runs it and answers PASS. The status line shows 1 in progress, 4 to do, 2 ideas and the week at 31 percent. An illustrative session"><rect x="1" y="1" width="358" height="655" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><rect x="16" y="16" width="328" height="625" rx="16" fill="#f3edf8" stroke="#e1d7ea" stroke-width="2"/><rect x="17" y="17" width="326" height="36" rx="15" fill="#e9e1f1"/><rect x="17" y="37" width="326" height="16" fill="#e9e1f1"/><rect x="32" y="29" width="11" height="11" fill="#7d68c4"/><rect x="50" y="29" width="11" height="11" fill="#4f9672"/><rect x="68" y="29" width="11" height="11" fill="#c8774d"/><text x="208" y="41" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6f6076" text-anchor="middle">meal-planner — claude</text><text x="32" y="76" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">❯ </tspan><tspan fill="#3a2f3d" font-weight="600">add a shopping list that</tspan></text><text x="32" y="97" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="600">  groups the items by aisle</tspan></text><text x="32" y="139" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Saved as </tspan><tspan fill="#7d68c4" font-weight="700">R-3</tspan><tspan fill="#3a2f3d" font-weight="400"> in the ledger,</tspan></text><text x="32" y="160" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  word for word.</tspan></text><text x="32" y="202" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Level normal. A fresh critic</tspan></text><text x="32" y="223" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  read the plan: 3 small tasks,</tspan></text><text x="32" y="244" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  a test for each.</tspan></text><text x="32" y="286" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Built, tests first. 6 of 6 pass.</tspan></text><text x="32" y="328" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">Handing R-3 to the verifier,</tspan></text><text x="32" y="349" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  which never saw the build.</tspan></text><text x="32" y="370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6f6076" font-weight="400">  ▸ starts the app clean, adds</tspan></text><text x="32" y="391" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#6f6076" font-weight="400">    12 items, checks aisle order</tspan></text><text x="32" y="433" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#4f9672" font-weight="700">✔ PASS </tspan><tspan fill="#3a2f3d" font-weight="400"> R-3 shopping list</tspan></text><text x="32" y="454" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  by aisle · report saved</tspan></text><text x="32" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#7d68c4" font-weight="700">● </tspan><tspan fill="#3a2f3d" font-weight="400">R-3 is done, with proof.</tspan></text><text x="32" y="517" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  Next: R-4, recipes by</tspan></text><text x="32" y="538" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3a2f3d" font-weight="400">  ingredient.</tspan></text><rect x="32" y="561" width="296" height="2" fill="#e1d7ea"/><text x="32" y="587" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve"><tspan fill="#6f6076">budgit  </tspan><tspan fill="#3f7f2c">✿ 1 in progress</tspan><tspan fill="#b4467a"> ⁘ 4 to do</tspan></text><text x="32" y="607" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve"><tspan fill="#6d57b8">✧ 2 ideas</tspan><tspan fill="#8a7f92"> ┊ </tspan><tspan fill="#2f7fbf">▰▰</tspan><tspan fill="#8a7f92">▱▱▱▱</tspan><tspan fill="#2f7fbf"> 31 %</tspan><tspan fill="#8a7f92"> · </tspan><tspan fill="#3f7f2c">you make it</tspan></text></svg>
