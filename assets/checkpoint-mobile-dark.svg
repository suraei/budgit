<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-label="A timeline of four stops: a long chat, Claude compacts it, Budgit saves a checkpoint just before, and the next session is pointed to the newest checkpoint"><rect x="1" y="1" width="358" height="338" rx="24" fill="#26222d" stroke="#3d3649" stroke-width="2"/><line x1="40" y1="50" x2="40" y2="290" stroke="#3d3649" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="50" x2="40" y2="210" stroke="#b7a8e0" stroke-width="4" stroke-linecap="round"/><circle cx="40" cy="50" r="12" fill="#2a2531" stroke="#b7a8e0" stroke-width="4"/><circle cx="40" cy="130" r="12" fill="#2a2531" stroke="#b7a8e0" stroke-width="4"/><circle cx="40" cy="210" r="12" fill="#8fcfae" stroke="#8fcfae" stroke-width="4"/><circle cx="40" cy="290" r="12" fill="#2a2531" stroke="#b7a8e0" stroke-width="4"/><g font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="start"><text x="68" y="48" font-size="17" font-weight="700" fill="#efe8f3">A long chat</text><text x="68" y="68" font-size="13" fill="#aa9cb4">the work piles up</text><text x="68" y="128" font-size="17" font-weight="700" fill="#efe8f3">Claude compacts</text><text x="68" y="148" font-size="13" fill="#aa9cb4">the old turns fold away</text><text x="68" y="208" font-size="17" font-weight="700" fill="#efe8f3">Checkpoint saved</text><text x="68" y="228" font-size="13" fill="#aa9cb4">just before: open items, git state</text><text x="68" y="288" font-size="17" font-weight="700" fill="#efe8f3">Next session</text><text x="68" y="308" font-size="13" fill="#aa9cb4">pointed to the newest one</text></g></svg>
