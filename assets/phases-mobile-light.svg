<svg xmlns="http://www.w3.org/2000/svg" width="360" height="502" viewBox="0 0 360 502" role="img" aria-label="A project walks seven phases: validate, design, plan, build, review, launch, retro. You approve a short document after each one. A small script takes the short route: plan, build, review, retro"><rect x="1" y="1" width="358" height="500" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><text x="24" y="34" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="start">An app or a game walks all seven phases.</text><text x="24" y="54" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#6f6076" text-anchor="start">A small script takes the short route.</text><rect x="38" y="116" width="4" height="4" fill="#7d68c4"/><rect x="38" y="124" width="4" height="4" fill="#7d68c4"/><rect x="38" y="132" width="4" height="4" fill="#7d68c4"/><rect x="38" y="170" width="4" height="4" fill="#7d68c4"/><rect x="38" y="178" width="4" height="4" fill="#7d68c4"/><rect x="38" y="186" width="4" height="4" fill="#7d68c4"/><rect x="38" y="224" width="4" height="4" fill="#7d68c4"/><rect x="38" y="232" width="4" height="4" fill="#7d68c4"/><rect x="38" y="240" width="4" height="4" fill="#7d68c4"/><rect x="38" y="278" width="4" height="4" fill="#7d68c4"/><rect x="38" y="286" width="4" height="4" fill="#7d68c4"/><rect x="38" y="294" width="4" height="4" fill="#7d68c4"/><rect x="38" y="332" width="4" height="4" fill="#7d68c4"/><rect x="38" y="340" width="4" height="4" fill="#7d68c4"/><rect x="38" y="348" width="4" height="4" fill="#7d68c4"/><rect x="38" y="386" width="4" height="4" fill="#7d68c4"/><rect x="38" y="394" width="4" height="4" fill="#7d68c4"/><rect x="38" y="402" width="4" height="4" fill="#7d68c4"/><rect x="30" y="88" width="20" height="20" fill="#7d68c4"/><rect x="36" y="94" width="8" height="