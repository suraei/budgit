0" fill="#7d68c4"/><rect x="36" y="418" width="8" height="8" fill="#fffdf8"/><text x="70" y="424" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3a2f3d" text-anchor="start">Retro</text><text x="70" y="444" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">you approve: the lessons</text><rect x="262" y="410" width="82" height="24" rx="7" fill="#e9e1f1" stroke="#7d68c4" stroke-width="2"/><text x="303" y="427" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a2f3d" text-anchor="middle">short route</text><text x="24" y="466" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6f6076" text-anchor="start">You approve a short document after each phase.</text></svg>
