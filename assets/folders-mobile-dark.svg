ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">docs/decisions/</text><text x="152.65" y="168" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">why things are as they are</text><path d="M30 64 V164" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="185" width="107.32" height="22" rx="11.0" fill="#2a2531" stroke="#b7a8e0" stroke-width="1.5"/><text x="73.66" y="199.96" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b7a8e0" text-anchor="middle">git: up to you</text><rect x="135.32" y="185" width="62.66" height="22" rx="11.0" fill="#2a2531" stroke="#8fcfae" stroke-width="1.5"/><text x="166.65" y="199.96" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8fcfae" text-anchor="middle">keep it</text><rect x="12" y="217" width="336" height="52" rx="12" fill="#352f40"/><path d="M24 242 L39 229 L54 242 V259 H24 Z" fill="#2a2531" stroke="#b7a8e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="248" width="8" height="11" rx="1" fill="#b7a8e0"/><text x="66" y="241" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#efe8f3" text-anchor="start">Home</text><text x="66" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">~/.budgit</text><rect x="271.8" y="226" width="68.2" height="18" rx="9" fill="#b7a8e0"/><text x="305.9" y="239" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2a2531" text-an