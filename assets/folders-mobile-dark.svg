tem-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#2a2531" text-anchor="middle">3 · first long chat</text><text x="132.52" y="352" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">newest 20</text><path d="M30 369 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="373" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">raw/</text><text x="78.84" y="373" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">web results, quarantined</text><path d="M30 390 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="394" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">bin/ · install.json</text><text x="179.49" y="394" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">daily job and update step</text><path d="M30 269 V390" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="411" width="139.22" height="22" rx="11.0" fill="#2a2531" stroke="#b7a8e0" stroke-width="1.5"/><text x="89.61" y="425.96" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b7a8e0" text-anchor="middle">private, in no repo</text><rect x="167.22" y="411" width="62.66" height="22" rx="11.0" fill="#2a2531" stroke="#8fcfae" stroke-width="1.5"/><text x="198.55" y="425.96" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8fcfae" text-anchor="middle">keep it</text><rect x="12" y="443" width="336" height="52" rx="12" fill="#352f40"/><rect x="25" y="465" width="28" height="20" rx="3" fill="#2a2531" stroke="#b7a8e0" stroke-width="2"/><path d="M23 465 H55 L50 456 H28 Z" fill="#352f40" stroke="#b7a8e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="471" width="10" height="3" rx="1" fill="#b7a8e0"/><text x="66" y="467" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#efe8f3" text-anchor="start">Each project</text><text x="66" y="484" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">&lt;project&gt;/.budgit</text><rect x="225.4" y="452" width="114.6" height="18" rx="9" fill="#b7a8e0"/><text x="282.7" y="465" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2a2531" text-anchor="middle">2 · first project</text><path d="M30 511 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="515" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">ledger.json · ledger.md</text><text x="206.33" y="515" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">every request, verbatim</text><path d="M30 532 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="536" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">progress.md</text><text x="125.81" y="536" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">where the work stopped</text><path d="M30 553 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="557" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">project.json</text><text x="132.52" y="557" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">this project's settings</text><path d="M30 574 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="578" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">plans/ research/ reports/</text><text x="219.75" y="578" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">as the work needs them</text><path d="M30 595 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="599" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">verify/</text><text x="98.97" y="599" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">PASS or FAIL, sealed</text><path d="M30 616 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="620" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#efe8f3" text-anchor="start">handover/</text><text x="112.39" y="620" font-