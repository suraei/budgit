<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" aria-label="The three folders Budgit creates, as a tree. The hub, made at setup, holds research, lessons, ideas, project notes and decisions. Home, ~/.budgit, made at setup, holds your config, the project list, session tracking, checkpoints from the first long chat on, quarantined web results and the daily job; it is in no repo. Each project gets .budgit with the ledger, progress, settings, plans, sealed verify reports and handover notes, kept out of git unless you choose to track the ledger. Nothing anywhere else"><rect x="1" y="1" width="358" height="728" rx="24" fill="#26222d" stroke="#3d3649" stroke-width="2"/><rect x="12" y="12" width="336" height="52" rx="12" fill="#352f40"/><rect x="26" y="22" width="26" height="32" rx="3" fill="#2a2531" stroke="#b7a8e0" stroke-width="2"/><circle cx="26" cy="28" r="2.5" fill="#b7a8e0"/><circle cx="26" cy="35" r="2.5" fill="#b7a8e0"/><circle cx="26" cy="42" r="2.5" fill="#b7a8e0"/><circle cx="26" cy="49" r="2.5" fill="#b7a8e0"/><rect x="33" y="31" width="13" height="3" rx="1" fill="#b7a8e0"/><rect x="33" y="38" width="9" height="3" rx="1" fill="#b7a8e0"/><text x="66" y="36" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#efe8f3" text-anchor="start">Hub</text><text x="66" y="53" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#aa9cb4" text-anchor="start">~/Projects/budgit-hub</text><rect x="271.8" y="21" width="68.2" height="18" rx="9" fill="#b7a8e0"/><text x="305.9" y="34" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#2a2531" text-anchor="middle">1 · setup</text><path d="M30 80 H40" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="84" font-family