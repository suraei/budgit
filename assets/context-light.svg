<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-label="An animated gauge of what Claude holds in mind. The kickoff core is always there. A phase file and its lenses slide in when the phase starts and leave after it. Installed skills wait as names, and skills why loads one for the job, then lets it go. The chat fills the gauge, Claude compacts, and the next chat starts from a checkpoint instead of the whole chat"><style>.a,.st,.ln{animation-duration:16s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}.st{animation-timing-function:steps(14,end)}.ln{animation-timing-function:linear}@keyframes k0{0%{transform:translate(300px,0px)}12.5%{transform:translate(300px,0px)}16.25%{transform:translate(0px,0px)}30%{transform:translate(0px,0px)}33.75%{transform:translate(300px,0px)}100%{transform:translate(300px,0px)}}@keyframes k1{0%{transform:translate(300px,0px)}32.5%{transform:translate(300px,0px)}36.25%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}@keyframes k2{0%{opacity:0}31.87%{opacity:0}33.12%{opacity:1}76.25%{opacity:1}77.5%{opacity:0}100%{opacity:0}}@keyframes k3{0%{opacity:1}50%{opacity:1}51.25%{opacity:0.25}61.25%{opacity:0.25}62.5%{opacity:1}100%{opacity:1}}@keyframes k4{0%{opacity:0}41.25%{opacity:0}42.5%{opacity:1}76.25%{opacity:1}77.5%{opacity:0}100%{opacity:0}}@keyframes k5{0%{opacity:0}50%{opacity:0}51.25%{opacity:1}61.25%{opacity:1}62.5%{opacity:0}100%{opacity:0}}@keyframes k6{0%{transform:scaleY(0)}65%{transform:scaleY(0)}75%{transform:scaleY(1)}76.88%{transform:scaleY(1)}78.12%{transform:scaleY(0)}100%{transform:scaleY(0)}}@keyframes k7{0%{opacity:0}72.5%{opacity:0}73.44%{opacity:1}76.88%{opacity:1}77.81%{opacity:0}100%{opacity:0}}@keyframes k8{0%{opacity:0}77.5%{opacity:0}78.75%{opacity:1}97.5%{opacity:1}98.75%{opacity:0}100%{opacity:0}}@keyframes k9{0%{opacity:0}0%{opacity:0}1.56%{opacity:1}11.25%{opacity:1}12.81%{opacity:0}100%{opacity:0}}@keyframes k10{0%{opacity:0}11.25%{opacity:0}12.81%{opacity:1}40%{opacity:1}41.56%{opacity:0}100%{opacity:0}}@keyframes k11{0%{opacity:0}40%{opacity:0}41.56%{opacity:1}63.75%{opacity:1}65.31%{opacity:0}100%{opacity:0}}@keyframes k12{0%{opacity:0}63.75%{opacity:0}65.31%{opacity:1}97.5%{opacity:1}99.06%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){.a,.st,.ln{animation-delay:-8.6s!important;animation-play-state:paused!important}}</style><rect x="1" y="1" width="958" height="422" rx="24" fill="#fffaf3" stroke="#e1d7ea" stroke-width="2"/><rect x="64" y="36" width="260" height="344" rx="16" fill="#fffdf8" stroke="#e1d7ea" stroke-width="2"/><clipPath id="cb"><rect x="66" y="38" width="256" height="340" rx="14"/></clipPath><g clip-path="url(#cb)"><rect x="80" y="334" width="228" height="36" rx="8" fill="#7d68c4"/><text x="194" y="357" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fffdf8" text-anchor="middle">kickoff core</text><g class="a" style="animation-name:k0;"><rect x="80" y="276" width="228" height="50" rx="8" fill="#ece4f4" stroke="#7d68c4" stroke-width="2"/><text x="194" y="299" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3a2f3d" text-anchor="middle">Build phase file</text><text x="194" y="315" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="middle">+ its lenses</text></g><g class="a" style="animation-name:k2;"><g class="a" style="animation-name:k1;"><rect x="80" y="276" width="228" height="50" rx="8" fill="#ece4f4" stroke="#7d68c4" stroke-width="2"/><text x="194" y="299" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3a2f3d" text-anchor="middle">Review phase file</text><text x="194" y="315" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6f6076" text-anchor="middle">+ its lenses</text></g></g><g class="a" style="animation-name:k4;"><rect x="80" y="252" width="54" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="107" y="264" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">tdd</text><rect x="138" y="252" width="54" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="165" y="264" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">impeccable</text><g class="a" style="animation-name:k3;"><rect x="196" y="252" width="54" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="223" y="264" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">code-review</text></g><rect x="254" y="252" width="54" height="16" rx="8" fill="#fffdf8" stroke="#6f6076" stroke-width="1.2"/><text x="281" y="264" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6f6076" text-anchor="middle">browser</text></g><g class="a" style="animation-name:k5;"><rect x="80" y="190" width="228" height="52" rx="8" fill="#fffdf8" stroke="#4f9672" stroke-width="2"/><text x="194" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3a2f3d" text-anchor="middle">code-review</text><text x="194" y="230" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#4f9672" text-anchor="middle">loaded for this job by skills why</text></g><g class="a" style="animation-name:k6;transform-box:fill-box;transform-origin:50% 100%"><rect x="66" y="38" width="256" height="340" rx="14" fill="#f8e4d8"/><text x="194" y="208" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#c8774d" text-anchor="middle">the chat so far</text></g><g class="a" style="animation-name:k7;"><text x="194" y="234" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3a2f3d" text-anchor="middle">Claude compacts</text></g><g class="a" style="animation-name:k8;"><path d="M290 334 V290" fill="none" stroke="#4f9672" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 290 L312 297 L290 304 Z" fill="#4f9672" stroke="#4f9672" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="322" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4f9672" text-anchor="start">the next chat starts from here</text></g></g><text x="194" y="406" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6f6076" text-anchor="middle">What Claude holds in mind</text><g class="a" style="animation-name:k9;"><rect x="372" y="36" width="564" height="78" rx="14" fill="#ece4f4"/></g><rect x="388" y="56" width="32" height="32" rx="0" fill="#7d68c4"/><text x="404" y="78.4" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#fffdf8" text-anchor="middle">1</text><text x="436" y="68" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3a2f3d" text-anchor="start">A small core, always</text><text x="436" y="88" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">The kickoff skill keeps only its core loaded.</text><g class="a" style="animation-name:k10;"><rect x="372" y="122" width="564" height="78" rx="14" fill="#ece4f4"/></g><rect x="388" y="142" width="32" height="32" rx="0" fill="#7d68c4"/><text x="404" y="164.4" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#fffdf8" text-anchor="middle">2</text><text x="436" y="154" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3a2f3d" text-anchor="start">One phase at a time</text><text x="436" y="174" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">A phase file and its lenses load when the phase starts, and leave</text><text x="436" y="191" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">after it.</text><g class="a" style="animation-name:k11;"><rect x="372" y="208" width="564" height="78" rx="14" fill="#ece4f4"/></g><rect x="388" y="228" width="32" height="32" rx="0" fill="#7d68c4"/><text x="404" y="250.4" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#fffdf8" text-anchor="middle">3</text><text x="436" y="240" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3a2f3d" text-anchor="start">Skills wait as names</text><text x="436" y="260" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">Installed skills sit as names. skills why loads the one this job</text><text x="436" y="277" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">needs.</text><g class="a" style="animation-name:k12;"><rect x="372" y="294" width="564" height="78" rx="14" fill="#ece4f4"/></g><rect x="388" y="314" width="32" height="32" rx="0" fill="#7d68c4"/><text x="404" y="336.4" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#fffdf8" text-anchor="middle">4</text><text x="436" y="326" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3a2f3d" text-anchor="start">Long chats restart light</text><text x="436" y="346" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">Before Claude compacts, Budgit saves a checkpoint. The next chat</text><text x="436" y="363" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6f6076" text-anchor="start">starts from it, not from the whole chat.</text></svg>