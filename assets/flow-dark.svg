, sans-serif" font-size="17" font-weight="700" fill="#efe8f3" text-anchor="start">Guards run on every tool call</text><text x="48" y="382" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#aa9cb4" text-anchor="start">Plain scripts, no model tokens. Each one asks you or says no.</text><rect x="-5" y="-5" width="10" height="10" fill="#efe8f3"><animateMotion dur="8s" repeatCount="indefinite" path="M84 44 H876" calcMode="linear"/></rect></svg>
