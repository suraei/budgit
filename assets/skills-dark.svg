<text x="54" y="487" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#2a2531" text-anchor="middle">7</text><text x="78" y="487" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#efe8f3" text-anchor="start">Retro</text><rect x="196" y="466" width="168" height="28" rx="8" fill="#3d3649" stroke="#b7a8e0" stroke-width="2"/><text x="280" y="485" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#efe8f3" text-anchor="middle">budgit retro-mine</text><rect x="24" y="520" width="912" height="2" fill="#3d3649"/><rect x="40" y="536" width="22" height="14" rx="4" fill="#b7a8e0"/><text x="72" y="548" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#aa9cb4" text-anchor="start">helper agent, ships with Budgit</text><rect x="330" y="536" width="22" height="14" rx="4" fill="#3d3649" stroke="#b7a8e0" stroke-width="2"/><text x="362" y="548" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#aa9cb4" text-anchor="start">Budgit command</text><rect x="510" y="536" width="22" height="14" rx="4" fill="none" stroke="#aa9cb4" stroke-width="2" stroke-dasharray="3 3"/><text x="542" y="548" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#aa9cb4" text-anchor="start">optional skill, used when you have it</text><text x="40" y="580" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#efe8f3" text-anchor="start">A missing skill is never a blocker: Claude does the plain step written next to it. </text><text x="40" y="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#b7a8e0" text-anchor="start">budgit skills why --job design/build</text><text x="376" y="600" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#aa9cb4" text-anchor="start">names the skill for a job and the reason, at the current budget level.</text></svg>
