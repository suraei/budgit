<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-label="The three folders Budgit creates, as a tree. The hub, made at setup, holds research, lessons, ideas, project notes and decisions. Home, ~/.budgit, made at setup, holds your config, the project list, session tracking, checkpoints from the first long chat on, quarantined web results and the daily job; it is in no repo. Each project gets .budgit with the ledger, progress, settings, plans, sealed verify reports and handover notes, kept out of git unless you choose to track the ledger. Nothing anywhere else"><rect x="1" y="1" width="958" height="446" rx="24" fill="#26222d" stroke="#3d3649" stroke-width="2"/><rect x="24" y="24" width="288" height="60" rx="14" fill="#352f40"/><rect x="40" y="38" width="26" height="32" rx="3" fill="#2a2531" stroke="#b7a8e0" stroke-width="2"/><circle cx="40" cy="44" r="2.5" fill="#b7a8e0"/><circle cx="40" cy="51" r="2.5" fill="#b7a8e0"/><circle cx="40" cy="58" r="2.5" fill="#b7a8e0"/><circle cx="40" cy="65" r="2.5" fill="#b7a8e0"/><rect x="47" y="47" width="13" height="3" rx="1" fill="#b7a8e0"/><rect x="47" y="54" width="9" height="3" rx="1" fill="#b7a8e0"/><text x="80" y="52" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#efe8f3" text-anchor="start">Hub</text><text x="80" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#aa9cb4" text-anchor="start">~/Projects/budgit-hub</text><rect x="224.58" y="14" width="75.42" height="20" rx="10" fill="#b7a8e0"/><text x="262.29" y="28" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2a2531" text-anchor="middle">1 · setup</text><path d="M48 84 V260" fill="none" stroke="#3d3649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 102 H62" fill