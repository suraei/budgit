name: tests
# The unittest suite on Linux, 8 shards. Each shard runs the modules tools/ci_shard.py gives it (longest first into the
# lightest shard, by tests/.durations.json); macOS-only modules are listed in tests/ci_linux_skip.txt and counted in the log.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run shard ${{ matrix.shard }} of 8
        run: |
          mods=$(python3 tools/ci_shard.py ${{ matrix.shard }}/8)
          python3 tools/runtests.py --workers 3 $mods
